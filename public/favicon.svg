<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background gradient - green to darker green -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#92400e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a16207;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="foliageGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bgGrad)" stroke="#047857" stroke-width="1"/>
  
  <!-- Tree trunk with gradient -->
  <rect x="13.5" y="19" width="5" height="8" fill="url(#trunkGrad)" rx="0.5"/>
  
  <!-- Main tree foliage - organic cloud shape -->
  <path d="M 16 4 C 12 4 9 7 9 11 C 6 11 4 13 4 16 C 4 18 5 19.5 6.5 20.5 C 8 22 10 22 12 21.5 C 14 22.5 18 22.5 20 21.5 C 22 22 24 22 25.5 20.5 C 27 19.5 28 18 28 16 C 28 13 26 11 23 11 C 23 7 20 4 16 4 Z" fill="url(#foliageGrad)" stroke="#d97706" stroke-width="0.5"/>
  
  <!-- Skill tree connection lines -->
  <path d="M 16 12 L 12 16 M 16 12 L 20 16 M 12 16 L 8 19 M 12 16 L 16 19 M 20 16 L 24 19" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  
  <!-- Skill nodes - representing learning progression -->
  <circle cx="16" cy="12" r="1.8" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
  <circle cx="12" cy="16" r="1.5" fill="#fbbf24" stroke="#ffffff" stroke-width="0.5"/>
  <circle cx="20" cy="16" r="1.5" fill="#fbbf24" stroke="#ffffff" stroke-width="0.5"/>
  <circle cx="8" cy="19" r="1.2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.5"/>
  <circle cx="24" cy="19" r="1.2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.5"/>
  <circle cx="16" cy="19" r="1.2" fill="#22c55e" stroke="#ffffff" stroke-width="0.5"/>
</svg>